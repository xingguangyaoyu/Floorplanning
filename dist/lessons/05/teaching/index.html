<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab5 · B*-tree 与轮廓线</title><link rel="stylesheet" href="../../../assets/interactive-player.css"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded-loading');</script><style>@font-face{font-family:LessonSans;src:url(../../../assets/fonts/noto-sans-sc-400.woff2)}@font-face{font-family:LessonSerif;src:url(../../../assets/fonts/noto-serif-sc-600.woff2);font-weight:600}body{font-family:LessonSans,sans-serif}main{max-width:none;margin:0;padding:0}#stage text{font-family:LessonSans,sans-serif}#stage g[role=button]{cursor:grab}#stage g:focus{outline:none}#stage g:focus rect{stroke:#183c2d;stroke-width:3}#steps{max-width:100%;width:100%}.below{margin:15px 0}.next-practice{margin:10px 0}</style></head><body><main><section class="player" aria-label="交互讲解"><div class="stage-wrap"><svg id="stage" viewBox="0 0 960 540" role="group" aria-label="可以操作的布局讲解"></svg><div id="trial-banner" hidden><strong>自己的尝试</strong><span id="trial-description"></span><button id="return">回到讲解</button></div></div><p id="caption" class="caption"></p><div id="question" class="question" hidden><h2 id="question-title"></h2><div id="choices"></div><p id="countdown" role="timer"></p><p id="answer" role="status"></p><button id="continue">继续看解释</button> <button id="hold">留在本题</button></div><div class="controls"><button id="play" aria-label="播放讲解" disabled>准备中</button><input id="seek" type="range" min="0" max="274.992" step=".01" value="0" aria-label="讲解进度"><span id="clock">0:00 / 4:35</span><label>速度 <select id="speed"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><button id="mute">静音</button><button id="cc" aria-pressed="true">文字</button><button id="fullscreen">全屏</button></div></section><details id="video-tools" class="video-tools"><summary>章节与尝试工具（可选）</summary><div class="below"><nav aria-label="讲解章节"><h2>讲解路线</h2><div id="chapters"></div><label>定位推演步骤 <select id="steps" aria-label="定位推演步骤"></select></label><button id="step-end">查看本步结尾</button></nav><section class="bench"><h2>点图里的模块试一试</h2><p>可拖动，也可用方向按钮逐格移动。试完回到讲解，就能从原处接着看。</p><div class="edit-controls"><label>当前模块 <select id="selected" aria-label="当前模块"></select></label><button data-move="-1,0" aria-label="左移一格">←</button><button data-move="0,1" aria-label="上移一格">↑</button><button data-move="0,-1" aria-label="下移一格">↓</button><button data-move="1,0" aria-label="右移一格">→</button><button id="undo" disabled>撤销</button><button id="reset">重置本次尝试</button></div><p id="metrics" role="status"></p></section></div></details><button id="go-lab" class="next-practice">继续本页的动手实验 ↓</button></main><script type="module" src="player.mjs"></script></body></html>
